<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Study Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1><a href="home.html" class="logo-link">Study Tracker</a></h1>
    <nav>
      <a href="home.html">Home</a>
      <a href="history.html">History</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
      <span id="welcomeMsg"></span>
      <button id="logoutBtn" class="btn-small">Log Out</button>
    </nav>
  </header>

  <section>
    <h2 class="section-title">Contact</h2>
    <p class="section-sub">Send a message or a suggestion</p>

    <form id="contactForm" class="narrow-form">
      <input type="text" placeholder="Your name" required>
      <input type="email" placeholder="Your email" required>
      <textarea placeholder="Your message" required></textarea>
      <button type="submit" class="btn">Send Message</button>
      <p id="contactMsg" class="success-text"></p>
    </form>
  </section>

  <footer>
    &copy; 2026 Study Tracker. Made for school project.
  </footer>

  <script type="module" src="lib/firebaseclient.js"></script>
  <script src="script.js" defer></script>
</body>
</html>
